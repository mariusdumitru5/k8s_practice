apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web
  template:
    metadata:
      labels:
        app: nginx-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
          # Mount della configurazione del virtualhost
            - name: config-volume
              mountPath: /etc/nginx/conf.d
            # Mount dell'index.html
            - name: html-volume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: config-volume 
          configMap: 
            name: nginx-config
            items: 
              - key: default.conf
                path: default.conf 
        - name: html-volume
          configMap: 
            name: nginx-config
            items: 
              - key: index.html 
                path: index.htm

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: web-app
spec:
  type: NodePort
  selector:
    app: nginx-web
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
