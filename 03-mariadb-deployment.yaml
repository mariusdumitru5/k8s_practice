apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: web-app
  labels:
    app: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        ports:
          - containerPort: 3306
            name: mysql
        envFrom:
          - secretRef:
              name: mariadb-secret
        volumeMounts:
          - name: mariadb-storage 
            mountPath: /var/lib/mysql
      volumes: 
        - name: mariadb-storage 
          persistentVolumeClaim:
            claimName: mariadb-pvc
--- 
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service 
  namespace: web-app
spec:
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP
